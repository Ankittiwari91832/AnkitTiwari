<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Multiverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Hero Section -->
    <header class="hero">
        <h1>Welcome to the Content Multiverse</h1>
        <p>Your one hub for all my content: opinions, gaming, and roast commentary</p>
        <div class="socials">
            <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
        </div>
    </header>

    <!-- Channels Section -->
    <section class="universe">
        <div class="planet-card">
            <h2>Personal Opinions</h2>
            <div class="video-container">
                <iframe src="YOUR_PERSONAL_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
            </div>
            <a href="#personal" class="explore-btn">Explore</a>
        </div>
        <div class="planet-card">
            <h2>The GodFather</h2>
            <div class="video-container">
                <iframe src="YOUR_GAMING_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
            </div>
            <a href="#gaming" class="explore-btn">Explore</a>
        </div>
        <div class="planet-card">
            <h2>The Sarcastic Society</h2>
            <div class="video-container">
                <iframe src="YOUR_ROAST_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
            </div>
            <a href="#roast" class="explore-btn">Explore</a>
        </div>
    </section>

    <!-- Sponsors / Contact -->
    <section class="contact">
        <h2>Contact / Sponsors</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Content Multiverse. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
