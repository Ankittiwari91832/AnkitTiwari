<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Multiverse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to the Content Multiverse</h1>
        <p>Explore my channels and join the journey!</p>
    </header>

    <section id="universe">
        <div class="planet" id="personal">
            <h2>Personal Opinions</h2>
            <a href="#personal-channel" class="explore-btn">Explore</a>
        </div>
        <div class="planet" id="gaming">
            <h2>The GodFather</h2>
            <a href="#gaming-channel" class="explore-btn">Explore</a>
        </div>
        <div class="planet" id="roast">
            <h2>The Sarcastic Society</h2>
            <a href="#roast-channel" class="explore-btn">Explore</a>
        </div>
    </section>

    <section id="personal-channel">
        <h2>Personal Opinions</h2>
        <iframe width="560" height="315" src="YOUR_PERSONAL_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
    </section>

    <section id="gaming-channel">
        <h2>The GodFather</h2>
        <iframe width="560" height="315" src="YOUR_GAMING_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
    </section>

    <section id="roast-channel">
        <h2>The Sarcastic Society</h2>
        <iframe width="560" height="315" src="YOUR_ROAST_VIDEO_LINK" frameborder="0" allowfullscreen></iframe>
    </section>

    <section id="socials">
        <h2>Follow Me</h2>
        <div class="social-links">
            <!-- Social media icons -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Content Multiverse. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
