<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Multiverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- HERO -->
<header class="hero">
    <h1>Welcome to the Content Multiverse</h1>
    <p>Your central hub for all my videos & content</p>
    <div class="socials">
        <a href="https://www.youtube.com/c/YOUR_PERSONAL_CHANNEL" target="_blank" class="social-icon youtube"><i class="fab fa-youtube"></i></a>
        <a href="https://www.instagram.com/YOUR_INSTAGRAM" target="_blank" class="social-icon insta"><i class="fab fa-instagram"></i></a>
        <a href="https://twitter.com/YOUR_TWITTER" target="_blank" class="social-icon twitter"><i class="fab fa-twitter"></i></a>
    </div>
</header>

<!-- CHANNELS / PLAYLIST EMBEDS -->
<section class="universe">

    <div class="planet-card">
        <h2>Personal Opinions</h2>
        <iframe width="100%" height="300" 
            src="https://www.youtube.com/embed/videoseries?list=YOUR_PERSONAL_UPLOADS_PLAYLIST_ID" 
            frameborder="0" allowfullscreen></iframe>
        <a href="https://www.youtube.com/c/YOUR_PERSONAL_CHANNEL" target="_blank" class="explore-btn">Visit Channel</a>
    </div>

    <div class="planet-card">
        <h2>The GodFather</h2>
        <iframe width="100%" height="300" 
            src="https://www.youtube.com/embed/videoseries?list=YOUR_GAMING_UPLOADS_PLAYLIST_ID" 
            frameborder="0" allowfullscreen></iframe>
        <a href="https://www.youtube.com/c/TheGodFather" target="_blank" class="explore-btn">Visit Channel</a>
    </div>

    <div class="planet-card">
        <h2>The Sarcastic Society</h2>
        <iframe width="100%" height="300" 
            src="https://www.youtube.com/embed/videoseries?list=YOUR_ROAST_UPLOADS_PLAYLIST_ID" 
            frameborder="0" allowfullscreen></iframe>
        <a href="https://www.youtube.com/c/TheSarcasticSociety" target="_blank" class="explore-btn">Visit Channel</a>
    </div>

</section>

<!-- CONTACT -->
<section class="contact" id="contact">
    <h2>Contact / Sponsors</h2>
    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 Content Multiverse</p>
</footer>

<script src="script.js"></script>
</body>
</html>
