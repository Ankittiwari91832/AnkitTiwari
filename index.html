<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Multiverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- HERO -->
<header class="hero">
    <h1>Welcome to the Content Multiverse</h1>
    <p>Your central hub for all my latest videos & content</p>
    <div class="socials">
        <a href="#" target="_blank" class="social-icon youtube"><i class="fab fa-youtube"></i></a>
        <a href="#" target="_blank" class="social-icon insta"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank" class="social-icon twitter"><i class="fab fa-twitter"></i></a>
    </div>
</header>

<!-- CHANNEL CARDS -->
<section class="universe">

    <div class="planet-card" id="personal">
        <h2>Personal Opinions</h2>
        <div class="video-container">
            <iframe id="personalVideo" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <a href="#contact" class="explore-btn">Contact / Sponsor</a>
    </div>

    <div class="planet-card" id="gaming">
        <h2>The GodFather</h2>
        <div class="video-container">
            <iframe id="gamingVideo" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <a href="#contact" class="explore-btn">Contact / Sponsor</a>
    </div>

    <div class="planet-card" id="roast">
        <h2>The Sarcastic Society</h2>
        <div class="video-container">
            <iframe id="roastVideo" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <a href="#contact" class="explore-btn">Contact / Sponsor</a>
    </div>

</section>

<!-- CONTACT -->
<section class="contact" id="contact">
    <h2>Contact / Sponsors</h2>
    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 Content Multiverse</p>
</footer>

<script src="script.js"></script>
</body>
</html>
